services:
  backend:
    build: ./backend
    # Общий образ для всех python-сервисов (scheduler/боты) — одна пересборка
    # `docker compose build backend` обновляет их все, рассинхрон невозможен.
    image: nekobak-backend
    container_name: nekobak-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_db:/app/data
      - backend_uploads:/app/uploads
      - backend_ingest:/app/ingest
      # Модели (131 МБ × 3) и ROI-конфиг в образ не запекаются — их кладут на
      # хост рядом с репозиторием (ml/ в git не коммитится). Пустой каталог —
      # это honest 503 от /api/predict, а не падение стека.
      - ./ml/models/rtdetr_temporal_640:/app/models:ro
      - ./ml/configs:/app/ml-configs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — generate one with `openssl rand -hex 32` and set it in .env}
      UPLOAD_DIR: /app/uploads
      INGEST_DIR: /app/ingest
      ML_MODEL_DIR: /app/models
      ML_ROI_CONFIG: /app/ml-configs/cameras_roi_v2.json
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      # Off by default: seeding creates demo accounts — opt in explicitly
      # and set SEED_ADMIN_PASSWORD/SEED_DEMO_PASSWORD when you do.
      RUN_SEED: ${RUN_SEED:-0}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      # Нужны бэкенду для разовой операции заведения камер (app/watcher_import).
      WATCHER_URL: ${WATCHER_URL:-}
      WATCHER_LOGIN: ${WATCHER_LOGIN:-}
      WATCHER_PASSWORD: ${WATCHER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Часовой контур: подбирает кадры сборщика из backend_ingest и прогоняет
  # через инференс (app/scheduler.py). Тот же образ, что backend; миграции не
  # запускает (ими владеет backend) — поэтому ждёт его здоровья.
  scheduler:
    image: nekobak-backend
    container_name: nekobak-scheduler
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "app.scheduler", "--interval", "3600"]
    # Унаследованный из Dockerfile healthcheck ходит на :8000 — здесь нет
    # HTTP-сервера, живость видна по логам проходов.
    healthcheck:
      disable: true
    volumes:
      - backend_db:/app/data
      - backend_uploads:/app/uploads
      - backend_ingest:/app/ingest
      - ./ml/models/rtdetr_temporal_640:/app/models:ro
      - ./ml/configs:/app/ml-configs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      UPLOAD_DIR: /app/uploads
      INGEST_DIR: /app/ingest
      ML_MODEL_DIR: /app/models
      ML_ROI_CONFIG: /app/ml-configs/cameras_roi_v2.json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      WATCHER_URL: ${WATCHER_URL:-}
      WATCHER_LOGIN: ${WATCHER_LOGIN:-}
      WATCHER_PASSWORD: ${WATCHER_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy

  # Синк кадров: S3-бакет сборщика → backend_ingest (app/s3_sync.py).
  # Без S3-кредов в .env мирно спит. БД нужна только чтобы узнать, какие
  # external_key активны — кадры чужих камер не выкачиваются.
  s3-sync:
    image: nekobak-backend
    container_name: nekobak-s3-sync
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "app.s3_sync", "--interval", "600"]
    healthcheck:
      disable: true
    volumes:
      - backend_db:/app/data
      - backend_ingest:/app/ingest
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INGEST_DIR: /app/ingest
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SNAPSHOTS_BUCKET: ${S3_SNAPSHOTS_BUCKET:-}
      S3_REGION: ${S3_REGION:-ru-central1}
    depends_on:
      backend:
        condition: service_healthy

  # Съём кадров с платформы Flussonic Watcher → backend_ingest
  # (app/watcher_sync.py). Пришёл на смену цепочке «сборщик → S3 → синк»:
  # камеры переехали на платформу. Без её настроек мирно спит.
  watcher-sync:
    image: nekobak-backend
    container_name: nekobak-watcher-sync
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "app.watcher_sync"]
    healthcheck:
      disable: true
    volumes:
      - backend_db:/app/data
      - backend_ingest:/app/ingest
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INGEST_DIR: /app/ingest
      WATCHER_URL: ${WATCHER_URL:-}
      WATCHER_LOGIN: ${WATCHER_LOGIN:-}
      WATCHER_PASSWORD: ${WATCHER_PASSWORD:-}
      WATCHER_INTERVAL_SECONDS: ${WATCHER_INTERVAL_SECONDS:-3600}
    depends_on:
      backend:
        condition: service_healthy

  # Telegram-бот привязки (long polling). Без TELEGRAM_BOT_TOKEN процесс
  # мирно спит — сервис можно держать поднятым всегда.
  telegram-bot:
    image: nekobak-backend
    container_name: nekobak-telegram-bot
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "app.telegram_bot"]
    healthcheck:
      disable: true
    volumes:
      - backend_db:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    depends_on:
      backend:
        condition: service_healthy

  # МАКС-бот привязки (long polling, app/max_bot.py). Без MAX_BOT_TOKEN
  # процесс мирно спит — токен появится после модерации бота на dev.max.ru.
  max-bot:
    image: nekobak-backend
    container_name: nekobak-max-bot
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "app.max_bot"]
    healthcheck:
      disable: true
    volumes:
      - backend_db:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nekobak-frontend
    restart: unless-stopped
    ports:
      # За Caddy (профиль https) наружу торчать не нужно — ставь в .env
      # FRONTEND_PORT=127.0.0.1:8080, чтобы порт был виден только с хоста.
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTPS-терминация: включается только профилем — локальная разработка
  # продолжает работать как раньше.
  #   docker compose --profile https up -d
  # Требует DNS на хост (deploy/Caddyfile) и FRONTEND_PORT=127.0.0.1:8080.
  caddy:
    image: caddy:2-alpine
    container_name: nekobak-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  backend_db:
  backend_uploads:
  backend_ingest:
  caddy_data:
  caddy_config:
