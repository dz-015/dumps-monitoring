services:
  backend:
    build: ./backend
    container_name: nekobak-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_db:/app/data
      - backend_uploads:/app/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nekobak.db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — generate one with `openssl rand -hex 32` and set it in .env}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      RUN_SEED: ${RUN_SEED:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: nekobak-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_db:
  backend_uploads:
