version: "3.9"

services:
  backend:
    build: ./backend
    container_name: nekobak-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/nekobak.db
      - SECRET_KEY=nekobak-super-secret-change-me
      - UPLOAD_DIR=/app/uploads

  frontend:
    build: ./frontend
    container_name: nekobak-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

