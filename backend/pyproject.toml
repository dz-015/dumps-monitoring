[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
]
ignore = [
  "E501",  # line too long — handled by formatter where sensible
  "B008",  # FastAPI uses `Depends()` as default — idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]   # test function names may be descriptive
"alembic/env.py" = ["E402"]  # sys.path insert before imports is intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
